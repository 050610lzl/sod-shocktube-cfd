name: CI - Sod Shock Tube CFD

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

jobs:
  test:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        python-version: ["3.9", "3.10", "3.11"]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify version
        run: |
          if [ ! -f VERSION ]; then
            echo "ERROR: VERSION file not found!"
            exit 1
          fi
          VERSION=$(cat VERSION | tr -d '\r' | tr -d '[:space:]')
          if ! echo "$VERSION" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "ERROR: Invalid version format: $VERSION (expected MAJOR.MINOR.PATCH)"
            exit 1
          fi
          echo "Project version: v$VERSION"
          PYPROJECT_VERSION=$(grep -oP 'version\s*=\s*"\K[^"]+' pyproject.toml | head -1 | tr -d '\r' | tr -d '[:space:]')
          if [ "$VERSION" != "$PYPROJECT_VERSION" ]; then
            echo "ERROR: VERSION ($VERSION) != pyproject.toml version ($PYPROJECT_VERSION)"
            exit 1
          fi
          echo "Version consistency check: PASSED"

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run unit tests
        run: |
          python -m pytest tests/ -v --tb=short --junitxml=test-results.xml

      - name: Run single scheme validation (upwind)
        run: |
          python run_simulation.py --n_points 100 --cfl 0.8 --scheme upwind

      - name: Run CFL stability check
        run: |
          python -c "
          import sys, numpy as np
          sys.path.insert(0, '.')
          from src.mesh_generator import generate_mesh
          from src.flow_initializer import initialize_flow
          from src.fd_schemes import upwind_step
          from src.boundary_handler import apply_boundary_condition
          from src.time_marcher import compute_dt
          from src.exact_solver import sod_exact_solution

          x, dx = generate_mesh(n_points=100)
          U = initialize_flow(x)
          dt = compute_dt(U, dx, cfl=0.8)
          U_new = upwind_step(U, dx, dt)

          rho = U_new[:, 0]
          u = U_new[:, 1] / rho
          p = (1.4 - 1.0) * (U_new[:, 2] - 0.5 * U_new[:, 1]**2 / rho)

          assert np.all(rho > 0), 'Negative density detected!'
          assert np.all(p > 0), 'Negative pressure detected!'
          assert np.max(u) < 1.0, 'Unphysical velocity detected!'
          print('TVD property check: PASSED')
          print(f'rho range: [{np.min(rho):.4f}, {np.max(rho):.4f}]')
          print(f'u max: {np.max(u):.4f}')
          print(f'p range: [{np.min(p):.4f}, {np.max(p):.4f}]')
          "

      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results-py${{ matrix.python-version }}
          path: test-results.xml

  lint:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install linting tools
        run: |
          pip install flake8

      - name: Run flake8 linting
        run: |
          flake8 src/ --max-line-length=120 --ignore=E501,W503,W504

  integration:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify version
        run: |
          VERSION=$(cat VERSION | tr -d '\r' | tr -d '[:space:]')
          echo "Project version: v$VERSION"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run all schemes integration test
        run: |
          python -m pytest tests/test_integration.py -v --tb=short
